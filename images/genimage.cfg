# KoinV genimage Configuration
# Generates GPT disk image with ESP, rootfs, and optional persistent partition

image "koinv-trixie-riscv64.img" {
    hdimage {
        gpt = true
    }

    partition "esp" {
        image = "esp.fat"
        size = 512M
        type = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"  # EFI System Partition
        uuid = "ESP-UUID-PLACEHOLDER"
        label = "ESP"
    }

    partition "rootfs" {
        image = "rootfs.ext4"
        size = 0  # Use remaining space
        type = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"  # Linux filesystem
        uuid = "ROOTFS-UUID-PLACEHOLDER"
        label = "ROOTFS"
    }

    partition "persist" {
        image = "persist.ext4"
        size = 4G
        type = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"  # Linux filesystem
        uuid = "PERSIST-UUID-PLACEHOLDER"
        label = "PERSIST"
        optional = true
    }
}

image "esp.fat" {
    fat {
        filesystem = "vfat"
        label = "ESP"
        bits = 32
    }

    # EFI bootloader
    copy {
        source = "boot/BOOTRISCV64.EFI"
        destination = "/EFI/BOOT/BOOTRISCV64.EFI"
    }

    # systemd-boot
    copy {
        source = "boot/loader"
        destination = "/loader"
    }

    # GRUB2
    copy {
        source = "boot/grub"
        destination = "/grub"
    }

    # Device Tree Blobs
    copy {
        source = "dtb"
        destination = "/dtb"
    }

    # Kernel
    copy {
        source = "boot/Image"
        destination = "/Image"
    }

    # Kernel commandline
    copy {
        source = "boot/cmdline.txt"
        destination = "/cmdline.txt"
    }
}

image "rootfs.ext4" {
    ext4 {
        filesystem = "ext4"
        label = "ROOTFS"
        features = "extent,flex_bg,has_journal,large_file,huge_file,uninit_bg,dir_nlink,extra_isize"
    }

    copy {
        source = "rootfs"
        destination = "/"
    }
}

image "persist.ext4" {
    ext4 {
        filesystem = "ext4"
        label = "PERSIST"
        features = "extent,flex_bg,has_journal,large_file,huge_file,uninit_bg,dir_nlink,extra_isize"
    }
}
