# Agile611 Koinos RISC-V genimage Configuration
# Generates both GPT disk image and ISO image for USB boot

# GPT Disk Image (for SD/NVMe/eMMC)
image "koinos-trixie-riscv64.img" {
    hdimage {
        gpt = true
    }

    partition "esp" {
        image = "esp.fat"
        size = 512M
        partition-type-uuid = "C12A7328-F81F-11D2-BA4B-00A0C93EC93B"  # EFI System Partition
        partition-uuid = "ESP-UUID-PLACEHOLDER"
    }

    partition "rootfs" {
        image = "rootfs.ext4"
        size = 0  # Use remaining space
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"  # Linux filesystem
        partition-uuid = "ROOTFS-UUID-PLACEHOLDER"
    }

    partition "persist" {
        image = "persist.ext4"
        size = 4G
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"  # Linux filesystem
        partition-uuid = "PERSIST-UUID-PLACEHOLDER"
    }
}

# ISO Image (for USB/DVD boot) - UEFI only
image "koinos-trixie-riscv64.iso" {
    iso {
        volume-id = "KOINV_TRIXIE"
        extraargs = "-publisher \"Agile611 Koinos RISC-V Project\" -A \"Agile611 Koinos RISC-V RISC-V Distribution\" -sysid LINUX"
    }
    srcpath = "iso-root"
}

# ESP FAT32 partition (shared by both images)
image "esp.fat" {
    vfat {
        label = "ESP"
    }
    srcpath = "esp"
}

# Rootfs ext4 partition
image "rootfs.ext4" {
    ext4 {
        label = "ROOTFS"
        features = "extent,flex_bg,has_journal,large_file,huge_file,uninit_bg,dir_nlink,extra_isize"
    }
    srcpath = "rootfs"
}

# Persistent ext4 partition (optional)
image "persist.ext4" {
    ext4 {
        label = "PERSIST"
        features = "extent,flex_bg,has_journal,large_file,huge_file,uninit_bg,dir_nlink,extra_isize"
    }
}
