set timeout=5
set default=0

menuentry "Agile611 Koinos RISC-V Trixie" {
    linux /Image console=ttyS0,115200 earlycon root=/dev/mmcblk0p2 rw rootwait
    devicetree /dtb/$(uname -m).dtb
}

menuentry "Agile611 Koinos RISC-V Trixie (ISO install)" {
    linux /Image console=ttyS0,115200 earlycon root=/dev/sr0 rw rootwait
    devicetree /dtb/$(uname -m).dtb
}
