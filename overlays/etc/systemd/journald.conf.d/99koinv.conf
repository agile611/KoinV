# KoinV Journald Configuration
[Journal]
Storage=persistent
Compress=yes
Seal=yes
SplitMode=uid
SyncIntervalSec=5m
RateLimitIntervalSec=30s
RateLimitBurst=1000
SystemMaxUse=100M
SystemMaxFiles=10
RuntimeMaxUse=50M
RuntimeMaxFiles=10
MaxFileSec=1month
MaxRetentionSec=1month
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
